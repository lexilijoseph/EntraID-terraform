
name: Entra ID Terraform CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.tf"
      - "*.tfvars"
      - ".github/workflows/terraform-cd.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: entra-id-terraform-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Entra ID Resources
    runs-on: ubuntu-latest

    environment: production

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"

      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_initial_password: ${{ secrets.TF_VAR_INITIAL_PASSWORD }}

      TF_IN_AUTOMATION: "true"

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform
      - name: Terraform Validate
        run: terraform validate -no-color

      # Generate deployment plan
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # Deploy resources into Microsoft Entra ID
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      # Display deployment outputs
      - name: Terraform Outputs
        if: success()
        run: terraform output

      # Deployment status
      - name: Deployment Summary
        if: success()
        run: |
          echo "Terraform deployment successful."
          echo "App Registration: 2026NovTest"
          echo "Groups: Admin, Developers, Testers"
          echo "Users: 7"
