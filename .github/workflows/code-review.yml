
name: Terraform Validation and Auto Merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: terraform-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # =========================================
  # JOB 1: TERRAFORM VALIDATION
  # =========================================

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Terraform Files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Terraform files:"
          find . -maxdepth 2 -name "*.tf" -print

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

  # =========================================
  # JOB 2: TERRAFORM SECURITY SCAN
  # =========================================

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Security Scan
        run: checkov -d . --framework terraform

  # =========================================
  # JOB 3: AUTOMATIC MERGE TO MAIN
  # =========================================

  auto-merge:
    name: Automatic Merge to Main
    runs-on: ubuntu-latest

    needs:
      - terraform-validation
      - terraform-security

    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.terraform-validation.result == 'success' &&
      needs.terraform-security.result == 'success'

    steps:
      - name: Check Pull Request Mergeability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json mergeable,isDraft,mergeStateStatus \
            > pr-status.json

          python - <<'PY'
          import json

          with open("pr-status.json") as f:
              status = json.load(f)

          print(json.dumps(status, indent=2))

          if status["isDraft"]:
              raise SystemExit("PR is still a draft.")

          if status["mergeable"] != "MERGEABLE":
              raise SystemExit(
                  "PR has merge conflicts or GitHub cannot "
                  "confirm that it is mergeable. Merge blocked."
              )

          print("No merge conflicts detected.")
          PY

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch

      - name: Confirm Merge
        run: |
          echo "SUCCESS: Pull Request merged into main."
          echo "Feature branch deletion requested."

  # =========================================
  # JOB 4: FAILURE REPORTING
  # =========================================

  report-failure:
    name: Report Validation Errors
    runs-on: ubuntu-latest

    needs:
      - terraform-validation
      - terraform-security
      - auto-merge

    if: >-
      always() &&
      (
        needs.terraform-validation.result == 'failure' ||
        needs.terraform-security.result == 'failure' ||
        needs.auto-merge.result == 'failure'
      )

    steps:
      - name: Publish Failure Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}

          VALIDATION: ${{ needs.terraform-validation.result }}
          SECURITY: ${{ needs.terraform-security.result }}
          MERGE: ${{ needs.auto-merge.result }}

        run: |
          cat > failure-report.md <<EOF
          # Pull Request Validation Failed

          The Pull Request was not automatically merged.

          | Validation | Result |
          |---|---|
          | Terraform Validation | $VALIDATION |
          | Security Scan | $SECURITY |
          | Automatic Merge | $MERGE |

          ## Required Action

          1. Open GitHub Actions.
          2. Identify the failed job and step.
          3. Read the error message.
          4. Fix the reported issue.
          5. Commit and push the corrected code.
          6. Wait for the workflow to execute again.

          **Merge blocked:** All required checks must pass
          and GitHub must confirm that the PR is mergeable.

          Workflow run:
          $GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file failure-report.md
