
name: Terraform AI Code Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: terraform-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli

  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs:
      - terraform-validation
      - terraform-security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get Pull Request Changes
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > pr-diff.txt

      - name: OpenAI AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          api_key = os.environ["OPENAI_API_KEY"]

          with open("pr-diff.txt", "r", encoding="utf-8") as file:
              diff = file.read()

          if not diff.strip():
              review = "No code changes found to review."
          else:
              prompt = """
          Act as a Senior Azure and Terraform Security Architect.

          Review this GitHub Pull Request.

          Project: Azure Microsoft Entra ID Terraform.

          Review for:
          1. Terraform coding standards.
          2. Security vulnerabilities.
          3. Hardcoded credentials and secrets.
          4. Excessive Azure permissions.
          5. Entra ID user and group configuration.
          6. Resource dependencies.
          7. Terraform best practices.
          8. Potential destructive changes.

          Provide:
          - Critical issues
          - High-risk issues
          - Medium-risk issues
          - Recommendations
          - Overall review verdict

          Do not claim to have executed Terraform.
          Do not approve code automatically.
          """

              payload = {
                  "model": "gpt-4.1-mini",
                  "input": [
                      {
                          "role": "user",
                          "content": [
                              {
                                  "type": "input_text",
                                  "text": prompt + "\n\nPR DIFF:\n" + diff[:60000]
                              }
                          ]
                      }
                  ],
                  "max_output_tokens": 3000
              }

              request = urllib.request.Request(
                  "https://api.openai.com/v1/responses",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read())

              review = "\n".join(
                  item.get("text", "")
                  for output in result.get("output", [])
                  for item in output.get("content", [])
                  if item.get("type") == "output_text"
              )

          if not review.strip():
              raise RuntimeError("AI returned an empty code review.")

          body = f"""
          ## AI Terraform Code Review

          {review}

          ---
          *Automated review generated by OpenAI using GitHub Actions.
          Human review is still required.*
          """

          with open("review.md", "w", encoding="utf-8") as file:
              file.write(body)

          print("AI review generated successfully.")
          PY

      - name: Publish AI Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file review.md
